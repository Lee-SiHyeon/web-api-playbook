name: Offline Node checks

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  offline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: npm run doctor
      - run: npm test
      - run: npm run verify:jobs-freelance
      - run: node scripts/verify-kmong-auth.mjs
      - run: node scripts/verify-soomgo-auth.mjs
      - run: npm run test:client-packs
      - run: npm run audit:consolidation
      - name: MyRealTrip pack compatibility
        run: node --test service-packs/affiliate/apps/affiliate-api-hub/tests/myrealtrip-marketing.test.mjs
